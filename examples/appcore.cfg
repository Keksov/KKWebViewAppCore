# ============================================================================
# AppCore launch configuration
# ============================================================================
# Run with:  AppMain.exe -config <path-to-this-file>
# (or place this file next to AppMain.exe and name it "app.cfg" to auto-load it)
#
# Format: KEY=VALUE, one per line. Lines starting with # or ; are comments.
# Relative paths are resolved against THIS file's folder.
# ============================================================================


# ---- Mode -------------------------------------------------------------------
# Chooses what AppCore starts and which URL it opens.
#
#   prod : 1) builds the frontend (bun run build)
#          2) starts the backend (bun run start) which serves BOTH the built
#             frontend and the API on ServerPort
#          3) opens  http://localhost:<ServerPort>/
#          -> one server, used for the real / installed app.
#
#   dev  : 1) starts the backend dev server (bun run dev, with --watch)
#          2) starts the frontend dev server (bun run dev = quasar dev) with
#             hot-reload, in its OWN console window that stays open
#          3) opens DevUrl
#          -> two servers; the frontend dev server proxies /api and /ws to the
#             backend. Used while developing so code changes reload instantly.
Mode=prod


# ---- bun executable ---------------------------------------------------------
# Path to bun.exe. A bare name (no \ or /) is looked up on PATH.
BunExe=bun


# ---- Project folders --------------------------------------------------------
# Backend project (has package.json with "dev" and "start" scripts, server.ts).
ServerDir=.\server

# Frontend project (has package.json with "dev" and "build" scripts; quasar).
UiDir=.\ui


# ---- Backend port -----------------------------------------------------------
# The port the backend (bun) listens on. Must match the port in the backend's
# own config (e.g. SERVER_PORT in server.env).
#   - prod: this IS the URL AppCore opens -> http://localhost:<ServerPort>/
#   - dev : the frontend dev server proxies API/WS calls here.
# Required.
ServerPort=4300


# ---- Dev URL ----------------------------------------------------------------
# The address AppCore opens in DEV mode only. This is the frontend dev server
# (quasar dev), NOT the backend. Quasar dev defaults to port 9000 and forwards
# /api and /ws to the backend on ServerPort.
# Ignored in prod mode. Defaults to http://localhost:<ServerPort>/ if empty.
DevUrl=http://localhost:9000/


# ---- Prod build -------------------------------------------------------------
# prod mode only: run "bun run build" (quasar build) before starting the
# server. Set to false if the frontend is already built.
BuildUi=true


# ---- Window -----------------------------------------------------------------
# true  = borderless window covering the whole screen (kiosk)
# false = normal 1024x768 window with title bar
FullScreen=true


# ---- Startup wait -----------------------------------------------------------
# Max seconds to wait for the target server's port to start accepting
# connections before opening the window anyway.
ReadyTimeoutSec=90
