# Example AppCore launch configuration.
# Used as: AppMain.exe -config <path-to-this-file>
# Relative paths are resolved against this file's directory.

# dev | prod
#   prod : build the UI and run the production server, then open the backend URL.
#   dev  : run the server and UI dev servers, each in its own console window
#          that stays open (cmd /k), then open DevUrl.
Mode=prod

# Path to bun. A bare name (no path separator) is looked up via PATH;
# a relative/absolute path is used directly.
BunExe=bun

# Server project directory (contains package.json with `dev` / `start` scripts).
ServerDir=.\server

# UI project directory (contains package.json with `dev` / `build` scripts).
UiDir=.\ui

# Backend port. The URL opened in prod mode is http://localhost:<ServerPort>/.
ServerPort=4300

# URL opened in dev mode (e.g. the frontend dev server with HMR).
DevUrl=http://localhost:9000/

# prod only: run `bun run build` in UiDir before starting the server.
BuildUi=true

# Open the window borderless on the whole screen.
FullScreen=true

# Max seconds to wait for the target port before opening the window anyway.
ReadyTimeoutSec=30
